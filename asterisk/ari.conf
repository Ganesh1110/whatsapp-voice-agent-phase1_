; =====================================================================
; Asterisk ARI configuration – user for the voice-bridge Stasis app
; =====================================================================
; Copy to /etc/asterisk/ari.conf and reload:  module reload res_ari.so
; =====================================================================

[general]
enabled=yes
pretty=yes
; Allow the FastAPI / ARI bridge to connect from any local origin during
; development. Restrict to specific origins before deploying.
allowed_origins=*

; ---------------------------------------------------------------------
; User that the Python Stasis application authenticates as.
; Set ARI_USER / ARI_PASSWORD in .env to match these values.
; ---------------------------------------------------------------------
[voice-bridge]
type=user
password=bridge-secret
read_only=no
