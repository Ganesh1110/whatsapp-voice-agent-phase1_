; =====================================================================
; Asterisk dialplan – route Jio SIP calls into the ARI voice bridge
; =====================================================================
; Copy to /etc/asterisk/extensions.conf and reload:  dialplan reload
; =====================================================================

[from-jio-trunk]
; Inbound call from the Jio SIP trunk (PSTN caller).
;
; Hand the call to the ARI Stasis application named "voice-bridge". The
; Python ARI bridge (asterisk/ari_bridge.py) subscribes to this app and,
; on StasisStart, creates an externalMedia channel that streams audio to
; FastAPI's /ari/stream WebSocket (STT → LLM → TTS).
exten => _X.,1,NoOp(Incoming Jio call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(voice-bridge)
 same => n,Hangup()

; ---------------------------------------------------------------------
; Local extension for testing the voice agent directly from an endpoint.
; ---------------------------------------------------------------------
[from-internal]
exten => 7000,1,NoOp(Test call to voice agent)
 same => n,Answer()
 same => n,Stasis(voice-bridge)
 same => n,Hangup()
