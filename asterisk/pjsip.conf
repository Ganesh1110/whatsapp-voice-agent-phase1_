; =====================================================================
; Asterisk PJSIP configuration – Jio SIP trunk + voice-agent endpoint
; =====================================================================
; Copy to /etc/asterisk/pjsip.conf (or /etc/asterisk/pjsip.conf.d/) and
; reload:  pjsip reload
; =====================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------------
; Jio SIP trunk (inbound from PSTN).
; Jio typically authenticates by source IP, so no password is needed here.
; If your Jio trunk uses registration instead, uncomment the registration
; block and set outbound_auth / aor below.
; ---------------------------------------------------------------------
[trunk-jio]
type=endpoint
context=from-jio-trunk
disallow=all
allow=ulaw
allow=alaw
allow=opus
; Force signed-linear so ARI externalMedia receives clean PCM (Asterisk
; transcodes from the SIP codec to signed-linear for the media stream).
direct_media=no
rtp_symmetric=yes
force_rport=yes
trust_id_inbound=yes
trust_id_outbound=yes
send_diversion=yes
from_user=jio-trunk
from_domain=jio.co.in

[trunk-jio]
type=identify
endpoint=trunk-jio
match=YOUR_JIO_TRUNK_IP

[trunk-jio]
type=aor
max_contacts=1
qualify_frequency=60

; Uncomment these if Jio requires registration instead of IP auth:
;[trunk-jio-reg]
;type=registration
;outbound_auth=trunk-jio-auth
;server_uri=sip:sip.jio.co.in
;client_uri=sip:jio-number@sip.jio.co.in
;expiration=3600
;retry_interval=60
;
;[trunk-jio-auth]
;type=auth
;auth_type=userpass
;username=jio-number
;password=YOUR_JIO_SIP_PASSWORD

; ---------------------------------------------------------------------
; Local endpoint used by the ARI Stasis application (outbound legs if any).
; ---------------------------------------------------------------------
[voice-agent]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
direct_media=no
dtmf_mode=rfc4733

[voice-agent]
type=aor
max_contacts=1

[voice-agent]
type=auth
auth_type=userpass
username=voice-agent
password=voice-agent-secret
